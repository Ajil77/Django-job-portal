{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Update Employer Profile | {{ user.username }}</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/employer_profile.css' %}">
</head>
<body class="bg-light">

  <!-- Main Container -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <!-- Card -->
        <div class="profile-form-card bg-white rounded-4 shadow-sm p-4 p-md-5">
          <!-- Header -->
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h4 fw-bold text-dark mb-0">
              <i class="fas fa-user-cog text-primary me-2"></i> Update Employer Profile
            </h1>
            <a href="{% url 'employer_home' %}" class="btn btn-sm btn-outline-secondary">
              <i class="fas fa-arrow-left me-1"></i> Back to Dashboard
            </a>
          </div>

          <!-- Form -->
          <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Company Name -->
            <div class="mb-4">
              <label for="company_name" class="form-label fw-semibold">Company Name <span class="text-danger">*</span></label>
              <input
                type="text"
                class="form-control form-control-lg"
                id="company_name"
                name="company_name"
                value="{{ profile.company_name }}"
                placeholder="e.g., Tech Innovations Inc."
                required
              >
            </div>

            <!-- Description -->
            <div class="mb-4">
              <label for="company_description" class="form-label fw-semibold">Company Description</label>
              <textarea
                class="form-control"
                id="company_description"
                name="company_description"
                rows="4"
                placeholder="Tell candidates about your mission, culture, and values...">{{ profile.company_description }}</textarea>
            </div>

            <!-- Website -->
            <div class="mb-4">
              <label for="website" class="form-label fw-semibold">Website</label>
              <input
                type="url"
                class="form-control"
                id="website"
                name="website"
                value="{{ profile.website }}"
                placeholder="https://yourcompany.com"
              >
            </div>

            <!-- Contact Number -->
            <div class="mb-4">
              <label for="contact_number" class="form-label fw-semibold">Contact Number</label>
              <input
                type="text"
                class="form-control"
                id="contact_number"
                name="contact_number"
                value="{{ profile.contact_number }}"
                placeholder="+1 (555) 123-4567"
              >
            </div>

            <!-- Logo -->
            <div class="mb-4 logo-section">
              <label for="logo" class="form-label fw-semibold">Company Logo</label>
              <input
                type="file"
                class="form-control"
                id="logo"
                name="logo"
                accept="image/*"
              >

              {% if profile.logo %}
              <div class="mt-3 d-flex align-items-center gap-3">
                <img src="{{ profile.logo.url }}" alt="Company logo" class="current-logo-preview rounded shadow-sm">
                <div>
                  <small class="text-muted d-block mb-1">Current logo</small>
                  <span class="badge bg-light text-dark px-2 py-1">Recommended: 400x400px</span>
                </div>
              </div>
              {% endif %}

              <div class="form-text mt-2">
                PNG or JPG only (max 2MB). Square format recommended.
              </div>
            </div>

            <!-- Submit Button -->
            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-primary btn-lg">
                <i class="fas fa-save me-2"></i> Save Profile Changes
              </button>
            </div>
          </form>
        </div>
        <!-- End Card -->
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
