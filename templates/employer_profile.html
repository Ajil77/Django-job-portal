{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Update Employer Profile | {{ user.username }}</title>
  
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="{% static 'css/employer_profile.css' %}">
  <style>

  </style>
</head>
<body>
  <div class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="profile-form-card">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 fw-bold text-gray-900">Update Employer Profile</h1>
            <a href="{% url 'employer_home' %}" class="btn btn-sm btn-outline-secondary">
              <i class="fas fa-arrow-left me-1"></i> Back to Dashboard
            </a>
          </div>

          <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Company Name -->
            <div class="mb-4">
              <label for="company_name" class="form-label">Company Name <span class="text-danger">*</span></label>
              <input
                type="text"
                class="form-control"
                id="company_name"
                name="company_name"
                value="{{ profile.company_name }}"
                placeholder="e.g., Tech Innovations Inc."
                required
              >
            </div>

            <!-- Company Description -->
            <div class="mb-4">
              <label for="company_description" class="form-label">Company Description</label>
              <textarea
                class="form-control"
                id="company_description"
                name="company_description"
                rows="4"
                placeholder="Tell candidates about your mission, culture, and values...">{{ profile.company_description }}</textarea>
            </div>

            <!-- Website -->
            <div class="mb-4">
              <label for="website" class="form-label">Website</label>
              <input
                type="url"
                class="form-control"
                id="website"
                name="website"
                value="{{ profile.website }}"
                placeholder="https://yourcompany.com"
              >
            </div>

            <!-- Contact Number -->
            <div class="mb-4">
              <label for="contact_number" class="form-label">Contact Number</label>
              <input
                type="text"
                class="form-control"
                id="contact_number"
                name="contact_number"
                value="{{ profile.contact_number }}"
                placeholder="+1 (555) 123-4567"
              >
            </div>

            <!-- Logo Upload -->
            <div class="mb-4 logo-section">
              <label for="logo" class="form-label">Company Logo</label>
              <input
                type="file"
                class="form-control"
                id="logo"
                name="logo"
                accept="image/*"
              >
              <!-- Current Logo Preview -->
              {% if profile.logo %}
                <div class="mt-2">
                  <small class="text-muted d-block mb-1">Current logo:</small>
                  <img src="{{ profile.logo.url }}" alt="Company logo" class="current-logo-preview">
                </div>
              {% endif %}
              <div class="form-text">
                Recommended: PNG or JPG (max 2MB). Square format (400x400) works best.
              </div>
            </div>

            <!-- Submit Button -->
            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg">
                <i class="fas fa-save me-2"></i> Save Profile Changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
