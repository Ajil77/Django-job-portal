{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Update Profile | JobSeeker</title>
  
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

 <link rel="stylesheet" href="{% static 'css/jobseeker_profile.css' %}">
</head>
<body>
  <div class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="profile-form-card">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 fw-bold text-gray-900">Update Your Profile</h1>
            <a href="{% url 'jobseeker_home' %}" class="btn btn-sm btn-outline-secondary">
              <i class="fas fa-arrow-left me-1"></i> Back to Dashboard
            </a>
          </div>

          <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Skills -->
            <div class="mb-4">
              <label for="skills" class="form-label">Skills</label>
              <textarea 
                class="form-control" 
                id="skills" 
                name="skills" 
                rows="3"
                placeholder="e.g., Python, Project Management, UI/UX Design...">{{ profile.skills }}</textarea>
            </div>

            <!-- Education -->
            <div class="mb-4">
              <label for="education" class="form-label">Education</label>
              <textarea 
                class="form-control" 
                id="education" 
                name="education" 
                rows="3"
                placeholder="e.g., B.Sc. Computer Science, XYZ University (2018–2022)">{{ profile.education }}</textarea>
            </div>

            <!-- Experience -->
            <div class="mb-4">
              <label for="experience" class="form-label">Work Experience</label>
              <textarea 
                class="form-control" 
                id="experience" 
                name="experience" 
                rows="4"
                placeholder="e.g., Software Engineer at ABC Corp (2020–Present) – Developed...">{{ profile.experience }}</textarea>
            </div>

            <!-- Contact Number -->
            <div class="mb-4">
              <label for="contact_number" class="form-label">Contact Number</label>
              <input 
                type="text" 
                class="form-control" 
                id="contact_number" 
                name="contact_number" 
                value="{{ profile.contact_number }}"
                placeholder="+1 (555) 123-4567">
            </div>

            <!-- Resume Upload -->
            <div class="mb-4">
              <label for="resume" class="form-label">Upload Resume (PDF, DOC)</label>
              <input 
                type="file" 
                class="form-control" 
                id="resume" 
                name="resume" 
                accept=".pdf,.doc,.docx">
              
              <!-- Show current resume if exists -->
              {% if profile.resume %}
                <div class="mt-2">
                  <a href="{{ profile.resume.url }}" target="_blank" class="current-resume">
                    <i class="fas fa-file-pdf"></i> View Current Resume
                  </a>
                </div>
              {% endif %}
            </div>

            <!-- Submit Button -->
            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg">
                <i class="fas fa-save me-2"></i> Save Profile Changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
