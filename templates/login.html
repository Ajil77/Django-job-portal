{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join JobHub - Build Your Career</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/register.css' %}">
    <style>
      
    </style>
</head>
<body>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="container">
            <h1><i class="fas fa-briefcase me-2"></i>Join JobHub</h1>
            <p>Build your future. Connect with top employers today.</p>
        </div>
    </section>

    <!-- Message Alerts -->


    <!-- Registration Form -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header text-center">
                        <i class="fas fa-user-plus me-2"></i>Login here
                    </div>
                    <div class="card-body p-4">
                        <form method="POST">
                            {% csrf_token %}
                            

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="Enter email" required>
                            </div>

                            <div class="row">
                                <div class="col-md-12 mb-3">
                                    <label for="password1" class="form-label">Password</label>
                                    <div class="password-container">
                                        <input type="password" class="form-control" id="password1" name="password" placeholder="Password" required>
                                        <span class="password-toggle" id="togglePassword"><i class="far fa-eye"></i></span>
                                    </div>
                                </div>
                               
                            </div>



                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-user-plus me-2"></i>Login
                                </button>
                            </div>
                        </form>

                        <div class="login-link mt-4">
                           dont have account? <a href="{% url 'register' %}">Register</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mb-4">
        &copy; {{ now.year }} JobHub. All rights reserved.
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Password Toggle Script -->
    
</body>
</html>
